<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alexa AI</title>

  <script src="https://js.puter.com/v2/"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 600px;
      background: #11182b;
      border: 1px solid #26314d;
      border-radius: 24px;
      padding: 25px;
      box-shadow: 0 20px 60px rgba(0,0,0,.4);
    }

    .logo { text-align: center; margin-bottom: 25px; }

    .logo-circle {
      width: 90px;
      height: 90px;
      margin: auto;
      border-radius: 50%;
      background: linear-gradient(135deg, #7c3aed, #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      box-shadow: 0 0 35px rgba(124,58,237,.5);
    }

    h1 { margin-top: 15px; font-size: 30px; }

    .status { text-align: center; color: #9ca3af; margin: 8px 0 20px; }

    .chat {
      height: 300px;
      overflow-y: auto;
      background: #0a0f1d;
      border-radius: 16px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .message {
      padding: 12px 15px;
      border-radius: 14px;
      margin-bottom: 10px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .user { background: #263c72; margin-left: 40px; }
    .ai { background: #1d293d; margin-right: 40px; }

    .input-area { display: flex; gap: 8px; }

    input {
      flex: 1;
      padding: 15px;
      border: none;
      outline: none;
      border-radius: 14px;
      background: #202a40;
      color: white;
      font-size: 16px;
    }

    button {
      border: none;
      cursor: pointer;
      border-radius: 14px;
      padding: 0 18px;
      font-size: 18px;
      color: white;
      background: #6d28d9;
    }

    button:hover { opacity: .9; }
    button:disabled { opacity: .5; cursor: not-allowed; }

    .mic { width: 60px; height: 55px; background: #0891b2; }
    .mic.listening { background: #dc2626; animation: pulse 1s infinite; }
    .send { width: 60px; height: 55px; }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(220,38,38,.6); }
      70% { box-shadow: 0 0 0 18px rgba(220,38,38,0); }
      100% { box-shadow: 0 0 0 0 rgba(220,38,38,0); }
    }

    .welcome { text-align: center; color: #9ca3af; padding: 20px; }

    .typing { display: inline-flex; gap: 4px; }
    .typing span {
      width: 6px; height: 6px; border-radius: 50%;
      background: #9ca3af; animation: blink 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: .2s; }
    .typing span:nth-child(3) { animation-delay: .4s; }

    @keyframes blink {
      0%, 80%, 100% { opacity: .2; }
      40% { opacity: 1; }
    }

    .wake-btn {
      width: auto;
      padding: 10px 20px;
      font-size: 14px;
      background: #166534;
      margin: 14px auto 0;
      display: block;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="logo">
      <div class="logo-circle">A</div>
      <h1>Alexa AI</h1>
      <div class="status" id="status">Ready to listen...</div>
    </div>

    <div class="chat" id="chat">
      <div class="welcome">
        Assalam-o-Alaikum 👋<br>
        Main Alexa hoon. Kuch bhi pucho!
      </div>
    </div>

    <div class="input-area">
      <button class="mic" id="micBtn">🎤</button>
      <input id="userInput" type="text" placeholder="Type your message...">
      <button class="send" id="sendBtn">➤</button>
    </div>

    <button class="wake-btn" id="wakeBtn">🔊 Wake Word Off - "Alexa AI" bolo</button>

  </div>

<script>

// ============================================
// SETUP
// ============================================
var input = document.getElementById("userInput");
var chat = document.getElementById("chat");
var statusText = document.getElementById("status");
var micBtn = document.getElementById("micBtn");
var sendBtn = document.getElementById("sendBtn");
var wakeBtn = document.getElementById("wakeBtn");

var MACRODROID_BASE_URL = "https://trigger.macrodroid.com/03575066-925e-45b0-92c1-bdaae7e80fa5";

var history = [
  {
    role: "system",
    content: "Tum 'Alexa AI' ho, user ke personal assistant, Roman Urdu/Hindi mix mein baat karte ho jaise ek dost karta hai. Agar user casual baat kare to khushdil aur mazakiya tone rakho. Agar user kaam ki baat kare (udhar, reminders, calculations) to seedha aur professional tone rakho. Jawab chota rakho jab tak detail na maangi jaye."
  }
];

if ("Notification" in window && Notification.permission === "default") {
  Notification.requestPermission();
}

// ============================================
// CHAT UI HELPERS
// ============================================
function addMessage(text, type) {
  var message = document.createElement("div");
  message.className = "message " + type;
  message.textContent = text;
  chat.appendChild(message);
  chat.scrollTop = chat.scrollHeight;
  return message;
}

function addTyping() {
  var el = document.createElement("div");
  el.className = "message ai";
  el.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
  return el;
}

function speak(text) {
  if (!("speechSynthesis" in window)) return;
  window.speechSynthesis.cancel();
  var voice = new SpeechSynthesisUtterance(text);
  voice.lang = "ur-PK";
  voice.rate = 0.95;
  voice.pitch = 1;
  window.speechSynthesis.speak(voice);
}

// ============================================
// PHONE CONTROL (MacroDroid)
// ============================================
function triggerPhoneAction(identifier) {
  if (!MACRODROID_BASE_URL) {
    return "MacroDroid abhi connect nahi hua.";
  }
  fetch(MACRODROID_BASE_URL + "/" + identifier).catch(function () {});
  return null;
}

// ============================================
// REMINDERS
// ============================================
function tryReminder(rawText) {
  var text = rawText.toLowerCase();
  var isReminder = text.indexOf("yaad dila") !== -1 || text.indexOf("remind") !== -1;
  if (!isReminder) return null;

  var match = text.match(/(\d+)\s*(minute|min|ghanta|ghante|hour|hours)/);
  if (!match) return null;

  var amount = parseInt(match[1], 10);
  var unit = match[2];
  var isHours = unit.indexOf("ghanta") === 0 || unit.indexOf("ghante") === 0 || unit.indexOf("hour") === 0;
  var ms = amount * (isHours ? 3600000 : 60000);

  var subject = rawText
    .replace(/\d+\s*(minute|min|ghanta|ghante|hour|hours)/i, "")
    .replace(/(baad|yaad dila(o|na)?|remind me( in| to)?|mujhe|ko)/gi, "")
    .trim();

  if (!subject) subject = "ye";

  setTimeout(function () {
    var msg = "Jani, yaad dila raha hoon: " + subject;
    addMessage(msg, "ai");
    speak(msg);
    if ("Notification" in window && Notification.permission === "granted") {
      new Notification("Alexa AI - Reminder", { body: msg });
    }
  }, ms);

  return "Theek hai, " + amount + " " + (isHours ? "ghante" : "minute") + " baad yaad dila dunga: " + subject;
}

// ============================================
// UDHAR KHATA
// ============================================
function getKhata() {
  try {
    return JSON.parse(localStorage.getItem("udhar_khata") || "[]");
  } catch (e) {
    return [];
  }
}

function saveKhata(khata) {
  localStorage.setItem("udhar_khata", JSON.stringify(khata));
}

function tryKhataCommand(rawText) {
  var text = rawText.toLowerCase();

  var addMatch = rawText.match(/([a-zA-Z\u0600-\u06FF]+)\s*(ne|ko)\s*(\d+)\s*(rupay|rupaye|rs)?\s*udhar\s*(liya|liye|diya|di)/i);
  if (addMatch) {
    var name = addMatch[1];
    var amount = parseInt(addMatch[3], 10);
    var dueMatch = rawText.match(/(\d+)\s*(din|hafte|hafta|mahine|mahina|week|month|day)/i);
    var dueText = dueMatch ? (dueMatch[1] + " " + dueMatch[2]) : "koi date nahi bataye";

    var khata = getKhata();
    khata.push({ name: name, amount: amount, due: dueText, date: new Date().toLocaleDateString(), paid: false });
    saveKhata(khata);

    return name + " ke naam " + amount + " rupay udhar likh diya. Wapsi: " + dueText + ".";
  }

  var clearMatch = rawText.match(/([a-zA-Z\u0600-\u06FF]+)\s*(ne wapis|ka udhar clear|paisa de diya|wapis kar diya)/i);
  if (clearMatch) {
    var name2 = clearMatch[1];
    var khata2 = getKhata();
    var found = false;
    for (var i = 0; i < khata2.length; i++) {
      if (khata2[i].name.toLowerCase() === name2.toLowerCase() && !khata2[i].paid) {
        khata2[i].paid = true;
        found = true;
      }
    }
    saveKhata(khata2);
    return found ? (name2 + " ka udhar clear kar diya.") : (name2 + " ke naam koi pending udhar nahi mila.");
  }

  var checkMatch = rawText.match(/([a-zA-Z\u0600-\u06FF]+)\s*(ka|ke)\s*(kitna)?\s*udhar/i);
  if (checkMatch && !addMatch) {
    var name3 = checkMatch[1];
    var khata3 = getKhata();
    var pending = khata3.filter(function (e) {
      return e.name.toLowerCase() === name3.toLowerCase() && !e.paid;
    });
    if (pending.length === 0) return name3 + " ke zimme koi udhar nahi hai.";
    var total = pending.reduce(function (sum, e) { return sum + e.amount; }, 0);
    return name3 + " ke zimme total " + total + " rupay udhar hai.";
  }

  if (text.indexOf("sara udhar") !== -1 || text.indexOf("poora khata") !== -1 || text.indexOf("khata dikhao") !== -1 || text.indexOf("khata sunao") !== -1) {
    var khata4 = getKhata().filter(function (e) { return !e.paid; });
    if (khata4.length === 0) return "Abhi koi udhar pending nahi hai.";
    var lines = khata4.map(function (e) { return e.name + ": " + e.amount + " rupay (" + e.due + ")"; });
    return "Pending udhar:\n" + lines.join("\n");
  }

  return null;
}

// ============================================
// LOCAL COMMANDS (checked before AI)
// ============================================
function tryLocalCommand(rawText) {
  var text = rawText.toLowerCase();

  var khataReply = tryKhataCommand(rawText);
  if (khataReply) return khataReply;

  var reminderReply = tryReminder(rawText);
  if (reminderReply) return reminderReply;

  if (text.indexOf("flashlight") !== -1 || text.indexOf("torch") !== -1) {
    var err = triggerPhoneAction("flashlight");
    return err || "Flashlight command bhej diya.";
  }

  if (text.indexOf("time") !== -1 || text.indexOf("waqt") !== -1) {
    return "Abhi time hai: " + new Date().toLocaleTimeString();
  }

  if (text.indexOf("date") !== -1 || text.indexOf("tareekh") !== -1) {
    return "Aaj ki date hai: " + new Date().toLocaleDateString();
  }

  if (text.indexOf("search ") === 0 || text.indexOf("google ") === 0) {
    var query = rawText.split(" ").slice(1).join(" ");
    window.open("https://www.google.com/search?q=" + encodeURIComponent(query), "_blank");
    return "Google pe '" + query + "' search kar diya.";
  }

  return null;
}

// ============================================
// AI BRAIN
// ============================================
function getAIReply(text) {
  history.push({ role: "user", content: text });
  if (history.length > 21) {
    history = [history[0]].concat(history.slice(-20));
  }

  return puter.ai.chat(history).then(function (response) {
    var replyText = (response && response.message && response.message.content) || String(response);
    history.push({ role: "assistant", content: replyText });
    return replyText;
  });
}

// ============================================
// SEND MESSAGE
// ============================================
function sendMessage() {
  var text = input.value.trim();
  if (!text) return;

  addMessage(text, "user");
  input.value = "";
  sendBtn.disabled = true;
  micBtn.disabled = true;
  statusText.textContent = "Alexa is thinking...";

  var localReply = tryLocalCommand(text);

  if (localReply) {
    addMessage(localReply, "ai");
    speak(localReply);
    statusText.textContent = "Ready to listen...";
    sendBtn.disabled = false;
    micBtn.disabled = false;
    return;
  }

  var typingEl = addTyping();

  getAIReply(text).then(function (reply) {
    typingEl.remove();
    addMessage(reply, "ai");
    speak(reply);
  }).catch(function (err) {
    typingEl.remove();
    addMessage("Sorry, abhi AI se connect nahi ho paya.", "ai");
    console.error(err);
  }).finally(function () {
    statusText.textContent = "Ready to listen...";
    sendBtn.disabled = false;
    micBtn.disabled = false;
  });
}

sendBtn.addEventListener("click", sendMessage);
input.addEventListener("keydown", function (e) {
  if (e.key === "Enter") sendMessage();
});

// ============================================
// VOICE INPUT (single command)
// ============================================
function startListening() {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    alert("Voice recognition not supported in this browser.");
    return;
  }

  var recognition = new SR();
  recognition.lang = "ur-PK";
  recognition.continuous = false;
  recognition.interimResults = false;

  micBtn.classList.add("listening");
  statusText.textContent = "Listening... 🎤";

  recognition.start();

  recognition.onresult = function (event) {
    var text = event.results[0][0].transcript;
    input.value = text;
    micBtn.classList.remove("listening");
    statusText.textContent = "Got it!";
    sendMessage();
  };

  recognition.onerror = function () {
    micBtn.classList.remove("listening");
    statusText.textContent = "Voice error. Try again.";
  };

  recognition.onend = function () {
    micBtn.classList.remove("listening");
    if (statusText.textContent === "Listening... 🎤") {
      statusText.textContent = "Ready to listen...";
    }
  };
}

micBtn.addEventListener("click", startListening);

// ============================================
// WAKE WORD ("Alexa AI")
// ============================================
var wakeModeOn = false;
var wakeRecognition = null;

function startWakeListener() {
  if (!wakeModeOn) return;

  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  wakeRecognition = new SR();
  wakeRecognition.lang = "ur-PK";
  wakeRecognition.continuous = false;
  wakeRecognition.interimResults = false;

  wakeRecognition.onresult = function (event) {
    var text = event.results[0][0].transcript;
    var lower = text.toLowerCase();

    if (lower.indexOf("alexa") !== -1) {
      var command = text.replace(/alexa\s*(ai)?/gi, "").trim();

      speak("Yes Boss!");
      statusText.textContent = "Yes Boss! Bolo 🎤";
      addMessage("Alexa AI", "user");
      addMessage("Yes Boss!", "ai");

      if (command) {
        input.value = command;
        sendMessage();
      } else {
        setTimeout(function () {
          if (wakeModeOn) startListening();
        }, 600);
      }
    }
  };

  wakeRecognition.onerror = function () {};

  wakeRecognition.onend = function () {
    if (wakeModeOn) {
      setTimeout(startWakeListener, 300);
    }
  };

  try {
    wakeRecognition.start();
  } catch (e) {}
}

wakeBtn.addEventListener("click", function () {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    alert("Voice recognition not supported in this browser.");
    return;
  }

  if (wakeModeOn) {
    wakeModeOn = false;
    if (wakeRecognition) wakeRecognition.stop();
    wakeBtn.textContent = '🔊 Wake Word Off - "Alexa AI" bolo';
    wakeBtn.style.background = "#166534";
    statusText.textContent = "Ready to listen...";
    return;
  }

  wakeModeOn = true;
  wakeBtn.textContent = '👂 Wake Word ON - "Alexa AI" bolo';
  wakeBtn.style.background = "#7c2d92";
  statusText.textContent = 'Sun raha hoon... "Alexa AI" bolo';

  startWakeListener();
});

</script>

</body>
</html>
