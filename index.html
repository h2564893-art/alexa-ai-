<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Alexa AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #080d18;
  color: white;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.app {
  width: 100%;
  max-width: 650px;
  min-height: 100vh;
  padding: 25px 18px;
  display: flex;
  flex-direction: column;
}

.header {
  text-align: center;
  padding: 20px 0;
}

.logo {
  width: 90px;
  height: 90px;
  margin: auto;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 38px;
  font-weight: bold;
  background: linear-gradient(135deg,#7c3aed,#06b6d4);
  box-shadow: 0 0 40px rgba(6,182,212,.35);
}

.header h1 {
  margin: 15px 0 5px;
  font-size: 30px;
}

.status {
  color: #9ca3af;
  font-size: 14px;
}

.chat {
  flex: 1;
  min-height: 350px;
  max-height: 60vh;
  overflow-y: auto;
  padding: 15px;
  background: #101827;
  border-radius: 20px;
  border: 1px solid #263248;
}

.message {
  max-width: 85%;
  padding: 13px 16px;
  margin: 10px 0;
  border-radius: 17px;
  line-height: 1.5;
  white-space: pre-wrap;
}

.user {
  margin-left: auto;
  background: #334b83;
}

.ai {
  margin-right: auto;
  background: #1d2a3c;
}

.input-area {
  display: flex;
  gap: 8px;
  padding-top: 15px;
}

input {
  flex: 1;
  min-width: 0;
  border: 0;
  outline: 0;
  border-radius: 15px;
  padding: 15px;
  background: #182235;
  color: white;
  font-size: 16px;
}

button {
  border: 0;
  border-radius: 15px;
  color: white;
  cursor: pointer;
  font-size: 20px;
}

.mic {
  width: 58px;
  background: #0891b2;
}

.mic.listening {
  background: #dc2626;
  animation: pulse 1s infinite;
}

.send {
  width: 58px;
  background: #6d28d9;
}

@keyframes pulse {
  0% {
    box-shadow: 0 0 0 0 rgba(220,38,38,.6);
  }

  70% {
    box-shadow: 0 0 0 15px rgba(220,38,38,0);
  }

  100% {
    box-shadow: 0 0 0 0 rgba(220,38,38,0);
  }
}

@media (max-width:500px) {

  .app {
    padding: 15px 10px;
  }

  .logo {
    width: 75px;
    height: 75px;
    font-size: 32px;
  }

  .header h1 {
    font-size: 25px;
  }

  .chat {
    min-height: 400px;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="header">

    <div class="logo">A</div>

    <h1>Alexa AI</h1>

    <div class="status" id="status">
      Ready to listen...
    </div>

  </div>

  <div class="chat" id="chat">

    <div class="message ai">
      Assalam-o-Alaikum Jani 👋
      Main Alexa hoon. Bolo, kya baat karni hai?
    </div>

  </div>

  <div class="input-area">

    <button
      class="mic"
      id="micBtn"
      onclick="startListening()">
      🎤
    </button>

    <input
      id="userInput"
      type="text"
      placeholder="Alexa se baat karo..."
      onkeydown="if(event.key==='Enter') sendMessage()"
    >

    <button
      class="send"
      onclick="sendMessage()">
      ➤
    </button>

  </div>

</div>

<script>

const input = document.getElementById("userInput");
const chat = document.getElementById("chat");
const statusText = document.getElementById("status");
const micBtn = document.getElementById("micBtn");

function addMessage(text, type) {

  const div = document.createElement("div");

  div.className = "message " + type;

  div.textContent = text;

  chat.appendChild(div);

  chat.scrollTop = chat.scrollHeight;
}

function speak(text) {

  if (!window.speechSynthesis) {
    return;
  }

  window.speechSynthesis.cancel();

  const speech = new SpeechSynthesisUtterance(text);

  speech.lang = "ur-PK";
  speech.rate = 0.95;
  speech.pitch = 1;

  window.speechSynthesis.speak(speech);
}

function getLocalReply(text) {

  const t = text.toLowerCase();

  if (
    t.includes("assalam") ||
    t.includes("salam")
  ) {
    return "Wa Alaikum Assalam Jani! ❤️ Main Alexa hoon. Bolo kya karna hai?";
  }

  if (
    t.includes("naam") ||
    t.includes("name")
  ) {
    return "Mera naam Alexa AI hai.";
  }

  if (
    t.includes("kaise ho") ||
    t.includes("how are you")
  ) {
    return "Alhamdulillah main bilkul theek hoon Jani. Tum sunao?";
  }

  if (
    t.includes("hello") ||
    t.includes("hi")
  ) {
    return "Hello Jani! Bolo, main sun rahi hoon.";
  }

  return "Jani, tumhari baat sun li. Abhi mera AI brain connect nahi hua. Agle step mein real AI connect karenge.";
}

function sendMessage() {

  const text = input.value.trim();

  if (!text) return;

  addMessage(text, "user");

  input.value = "";

  statusText.textContent = "Alexa soch rahi hai...";

  setTimeout(function() {

    const reply = getLocalReply(text);

    addMessage(reply, "ai");

    speak(reply);

    statusText.textContent = "Ready to listen...";

  }, 500);
}

function startListening() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {

    alert(
      "Is browser mein voice recognition available nahi hai. Chrome use karo."
    );

    return;
  }

  const recognition = new SpeechRecognition();

  recognition.lang = "ur-PK";

  recognition.continuous = false;

  recognition.interimResults = false;

  micBtn.classList.add("listening");

  statusText.textContent =
    "Listening... Bolo Jani 🎤";

  recognition.start();

  recognition.onresult = function(event) {

    const text =
      event.results[0][0].transcript;

    input.value = text;

    micBtn.classList.remove("listening");

    statusText.textContent =
      "Baat samajh gayi...";

    sendMessage();
  };

  recognition.onerror = function() {

    micBtn.classList.remove("listening");

    statusText.textContent =
      "Voice error. Dobara try karo.";

  };

  recognition.onend = function() {

    micBtn.classList.remove("listening");

    if (
      statusText.textContent ===
      "Listening... Bolo Jani 🎤"
    ) {
      statusText.textContent =
        "Ready to listen...";
    }

  };
}

</script>

</body>
</html>
