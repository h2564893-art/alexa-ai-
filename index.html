<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alexa — Aapki Sahayak</title>

<script src="https://js.puter.com/v2/"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --ink: #0E1420;
    --panel: #161F33;
    --panel-2: #1B2540;
    --line: #2B3654;
    --brass: #C89B54;
    --brass-soft: rgba(200,155,84,.14);
    --coral: #D97046;
    --text: #F1ECDE;
    --text-dim: #8D96AE;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body{
    font-family: 'Inter', sans-serif;
    background: var(--ink);
    background-image:
      radial-gradient(1200px 500px at 50% -10%, rgba(200,155,84,.08), transparent 60%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px;
  }

  .app{
    width: 100%;
    max-width: 620px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,.45);
  }

  .header{
    padding: 30px 32px 22px;
    border-bottom: 1px solid var(--brass-soft);
    position: relative;
  }
  .header::before, .header::after{
    content: "";
    position: absolute;
    left: 32px; right: 32px;
    height: 1px;
    background: linear-gradient(90deg, var(--brass), transparent 70%);
  }
  .header::before{ top: 10px; }
  .header::after{ bottom: 0; opacity: .5; }

  .brand{
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
  }

  .wordmark{
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 34px;
    letter-spacing: .2px;
    color: var(--text);
  }

  .wave{
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 22px;
  }
  .wave span{
    width: 3px;
    background: var(--brass);
    border-radius: 2px;
    animation: idle 1.8s ease-in-out infinite;
  }
  .wave span:nth-child(1){ height: 40%; animation-delay: 0s; }
  .wave span:nth-child(2){ height: 90%; animation-delay: .15s; }
  .wave span:nth-child(3){ height: 60%; animation-delay: .3s; }
  .wave span:nth-child(4){ height: 100%; animation-delay: .45s; }
  .wave span:nth-child(5){ height: 55%; animation-delay: .6s; }
  @keyframes idle{
    0%, 100% { transform: scaleY(.4); opacity: .55; }
    50% { transform: scaleY(1); opacity: 1; }
  }
  .wave.active span{ animation-duration: .6s; }
  .wave.active span{ background: var(--coral); }

  .tagline{
    margin-top: 6px;
    font-size: 13.5px;
    color: var(--text-dim);
  }

  .status-row{
    margin-top: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text-dim);
  }
  .status-dot{
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--brass);
    box-shadow: 0 0 0 3px var(--brass-soft);
  }
  .status-dot.busy{ background: var(--coral); box-shadow: 0 0 0 3px rgba(217,112,70,.18); }

  .chat{
    height: 320px;
    overflow-y: auto;
    padding: 22px 32px;
    background:
      repeating-linear-gradient(
        to bottom,
        transparent,
        transparent 37px,
        var(--line) 38px
      );
    background-position: 0 8px;
  }
  .chat::-webkit-scrollbar{ width: 6px; }
  .chat::-webkit-scrollbar-thumb{ background: var(--line); border-radius: 3px; }

  .welcome{
    color: var(--text-dim);
    font-size: 14.5px;
    line-height: 1.9;
    padding-top: 4px;
  }
  .welcome strong{ color: var(--text); font-weight: 500; }

  .row{
    display: flex;
    margin-bottom: 14px;
  }
  .row.user{ justify-content: flex-end; }
  .row.ai{ justify-content: flex-start; }

  .bubble{
    max-width: 78%;
    padding: 10px 14px;
    font-size: 14.5px;
    line-height: 1.55;
    white-space: pre-wrap;
    border-radius: 4px;
  }
  .bubble.user{
    background: var(--brass-soft);
    border: 1px solid rgba(200,155,84,.35);
    color: var(--text);
  }
  .bubble.ai{
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
  }
  .label{
    font-size: 10.5px;
    letter-spacing: .3px;
    color: var(--text-dim);
    margin-bottom: 5px;
  }

  .typing{ display: inline-flex; gap: 4px; padding: 2px 0; }
  .typing span{
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--brass);
    animation: blink 1.2s infinite;
  }
  .typing span:nth-child(2){ animation-delay: .2s; }
  .typing span:nth-child(3){ animation-delay: .4s; }
  @keyframes blink{ 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  .input-area{
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 18px 28px;
    border-top: 1px solid var(--line);
    background: var(--panel-2);
  }

  .mic-btn{
    width: 46px; height: 46px;
    flex-shrink: 0;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--panel);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color .15s, background .15s;
  }
  .mic-btn:hover{ border-color: var(--brass); }
  .mic-btn .bars{ display: flex; align-items: center; gap: 2px; height: 16px; }
  .mic-btn .bars i{
    width: 2.5px; border-radius: 2px;
    background: #8D96AE;
    display: block;
  }
  .mic-btn .bars i:nth-child(1){ height: 40%; }
  .mic-btn .bars i:nth-child(2){ height: 90%; }
  .mic-btn .bars i:nth-child(3){ height: 60%; }
  .mic-btn .bars i:nth-child(4){ height: 100%; }
  .mic-btn.listening{ background: rgba(217,112,70,.12); border-color: var(--coral); }
  .mic-btn.listening .bars i{ background: var(--coral); animation: idle .5s ease-in-out infinite; }
  .mic-btn.listening .bars i:nth-child(2){ animation-delay: .1s; }
  .mic-btn.listening .bars i:nth-child(3){ animation-delay: .2s; }
  .mic-btn.listening .bars i:nth-child(4){ animation-delay: .3s; }

  input[type="text"]{
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    border-bottom: 1px solid var(--line);
    padding: 10px 2px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    transition: border-color .15s;
  }
  input[type="text"]::placeholder{ color: var(--text-dim); }
  input[type="text"]:focus{ border-color: var(--brass); }

  .send-btn{
    width: 44px; height: 44px;
    flex-shrink: 0;
    border-radius: 50%;
    border: none;
    background: var(--brass);
    color: var(--ink);
    font-size: 17px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity .15s, transform .1s;
  }
  .send-btn:hover{ opacity: .9; }
  .send-btn:active{ transform: scale(.94); }
  .send-btn:disabled, .mic-btn:disabled{ opacity: .4; cursor: not-allowed; }

  .wake-row{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 14px 28px 22px;
    background: var(--panel-2);
  }
  .wake-label{
    font-size: 12.5px;
    color: var(--text-dim);
  }
  .wake-label b{ color: var(--text); font-weight: 500; }

  .switch{
    width: 38px; height: 20px;
    border-radius: 10px;
    background: var(--line);
    border: 1px solid var(--line);
    cursor: pointer;
    position: relative;
    flex-shrink: 0;
    transition: background .2s;
  }
  .switch .knob{
    position: absolute;
    top: 2px; left: 2px;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--text-dim);
    transition: transform .2s, background .2s;
  }
  .switch.on{ background: var(--brass-soft); border-color: var(--brass); }
  .switch.on .knob{ transform: translateX(18px); background: var(--brass); }

  @media (prefers-reduced-motion: reduce){
    .wave span, .mic-btn.listening .bars i, .typing span { animation: none !important; }
  }
</style>
</head>

<body>

  <div class="app">

    <div class="header">
      <div class="brand">
        <div>
          <div class="wordmark">Alexa</div>
          <div class="tagline">Aapki roz-marra ki sahayak — bolo ya likho</div>
        </div>
        <div class="wave" id="wave">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>
      <div class="status-row">
        <span class="status-dot" id="statusDot"></span>
        <span id="status">Ready to listen</span>
      </div>
    </div>

    <div class="chat" id="chat">
      <div class="welcome">
        Assalam-o-Alaikum 👋 <strong>Main Alexa hoon.</strong><br>
        Yaad dilana ho, udhar likhna ho, ya bas baat karni ho — kuch bhi pucho.
      </div>
    </div>

    <div class="input-area">
      <button class="mic-btn" id="micBtn" title="Bol kar poocho">
        <span class="bars"><i></i><i></i><i></i><i></i></span>
      </button>
      <input id="userInput" type="text" placeholder="Likh kar poocho...">
      <button class="send-btn" id="sendBtn">➤</button>
    </div>

    <div class="wake-row">
      <div class="switch" id="wakeBtn"><div class="knob"></div></div>
      <div class="wake-label" id="wakeLabel">"<b>Alexa</b>" bol kar jagao — abhi <b>band</b> hai</div>
    </div>

  </div>

<script>

var input = document.getElementById("userInput");
var chat = document.getElementById("chat");
var statusText = document.getElementById("status");
var statusDot = document.getElementById("statusDot");
var micBtn = document.getElementById("micBtn");
var sendBtn = document.getElementById("sendBtn");
var wakeBtn = document.getElementById("wakeBtn");
var wakeLabel = document.getElementById("wakeLabel");
var wave = document.getElementById("wave");

var MACRODROID_BASE_URL = "https://trigger.macrodroid.com/03575066-925e-45b0-92c1-bdaae7e80fa5";

var history = [
  {
    role: "system",
    content: "Tum 'Alexa' ho, user ke personal assistant, Roman Urdu/Hindi mix mein baat karte ho jaise ek dost karta hai. Agar user casual baat kare to khushdil aur mazakiya tone rakho. Agar user kaam ki baat kare (udhar, reminders, calculations) to seedha aur professional tone rakho. Jawab chota rakho jab tak detail na maangi jaye."
  }
];

if ("Notification" in window && Notification.permission === "default") {
  Notification.requestPermission();
}

function setStatus(text, busy) {
  statusText.textContent = text;
  statusDot.classList.toggle("busy", !!busy);
}

function addMessage(text, type) {
  var row = document.createElement("div");
  row.className = "row " + type;

  var bubbleWrap = document.createElement("div");

  var label = document.createElement("div");
  label.className = "label";
  label.textContent = type === "user" ? "AAP" : "ALEXA";
  bubbleWrap.appendChild(label);

  var bubble = document.createElement("div");
  bubble.className = "bubble " + type;
  bubble.textContent = text;
  bubbleWrap.appendChild(bubble);

  row.appendChild(bubbleWrap);
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
  return row;
}

function addTyping() {
  var row = document.createElement("div");
  row.className = "row ai";
  row.innerHTML = '<div><div class="label">ALEXA</div><div class="bubble ai"><span class="typing"><span></span><span></span><span></span></span></div></div>';
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
  return row;
}

var cachedVoices = [];
function loadVoices() {
  cachedVoices = window.speechSynthesis.getVoices();
}
loadVoices();
if (window.speechSynthesis.onvoiceschanged !== undefined) {
  window.speechSynthesis.onvoiceschanged = loadVoices;
}

function pickFemaleVoice() {
  var voices = cachedVoices.length ? cachedVoices : window.speechSynthesis.getVoices();
  var priorities = [
    function (v) { return /hindi/i.test(v.name) && /female/i.test(v.name); },
    function (v) { return v.lang === "hi-IN"; },
    function (v) { return /Google.*Female/i.test(v.name); },
    function (v) { return /Zira|Susan|Samantha|Google UK English Female/i.test(v.name); },
    function (v) { return v.lang && v.lang.indexOf("en") === 0; }
  ];
  for (var i = 0; i < priorities.length; i++) {
    var found = voices.find(priorities[i]);
    if (found) return found;
  }
  return voices[0] || null;
}

function speak(text) {
  if (!("speechSynthesis" in window)) return;
  window.speechSynthesis.cancel();

  var utter = new SpeechSynthesisUtterance(text);
  var voice = pickFemaleVoice();

  if (voice) {
    utter.voice = voice;
    utter.lang = voice.lang;
  } else {
    utter.lang = "hi-IN";
  }

  utter.rate = 0.97;
  utter.pitch = 1.1;
  utter.volume = 1;

  wave.classList.add("active");
  utter.onend = function () { wave.classList.remove("active"); };
  utter.onerror = function () { wave.classList.remove("active"); };

  window.speechSynthesis.speak(utter);
}

function triggerPhoneAction(identifier) {
  if (!MACRODROID_BASE_URL) {
    return "MacroDroid abhi connect nahi hua.";
  }
  fetch(MACRODROID_BASE_URL + "/" + identifier).catch(function () {});
  return null;
}

function tryReminder(rawText) {
  var text = rawText.toLowerCase();
  var isReminder = text.indexOf("yaad dila") !== -1 || text.indexOf("remind") !== -1;
  if (!isReminder) return null;

  var match = text.match(/(\d+)\s*(minute|min|ghanta|ghante|hour|hours)/);
  if (!match) return null;

  var amount = parseInt(match[1], 10);
  var unit = match[2];
  var isHours = unit.indexOf("ghanta") === 0 || unit.indexOf("ghante") === 0 || unit.indexOf("hour") === 0;
  var ms = amount * (isHours ? 3600000 : 60000);

  var subject = rawText
    .replace(/\d+\s*(minute|min|ghanta|ghante|hour|hours)/i, "")
    .replace(/(baad|yaad dila(o|na)?|remind me( in| to)?|mujhe|ko)/gi, "")
    .trim();

  if (!subject) subject = "ye";

  setTimeout(function () {
    var msg = "Jani, yaad dila raha hoon: " + subject;
    addMessage(msg, "ai");
    speak(msg);
    if ("Notification" in window && Notification.permission === "granted") {
      new Notification("Alexa — Reminder", { body: msg });
    }
  }, ms);

  return "Theek hai, " + amount + " " + (isHours ? "ghante" : "minute") + " baad yaad dila dunga: " + subject;
}

function getKhata() {
  try {
    return JSON.parse(localStorage.getItem("udhar_khata") || "[]");
  } catch (e) {
    return [];
  }
}

function saveKhata(khata) {
  localStorage.setItem("udhar_khata", JSON.stringify(khata));
}

function tryKhataCommand(rawText) {
  var text = rawText.toLowerCase();

  var addMatch = rawText.match(/([a-zA-Z\u0600-\u06FF]+)\s*(ne|ko)\s*(\d+)\s*(rupay|rupaye|rs)?\s*udhar\s*(liya|liye|diya|di)/i);
  if (addMatch) {
    var name = addMatch[1];
    var amount = parseInt(addMatch[3], 10);
    var dueMatch = rawText.match(/(\d+)\s*(din|hafte|hafta|mahine|mahina|week|month|day)/i);
    var dueText = dueMatch ? (dueMatch[1] + " " + dueMatch[2]) : "koi date nahi bataye";

    var khata = getKhata();
    khata.push({ name: name, amount: amount, due: dueText, date: new Date().toLocaleDateString(), paid: false });
    saveKhata(khata);

    return name + " ke naam " + amount + " rupay udhar likh diya. Wapsi: " + dueText + ".";
  }

  var clearMatch = rawText.match(/([a-zA-Z\u0600-\u06FF]+)\s*(ne wapis|ka udhar clear|paisa de diya|wapis kar diya)/i);
  if (clearMatch) {
    var name2 = clearMatch[1];
    var khata2 = getKhata();
    var found = false;
    for (var i = 0; i < khata2.length; i++) {
      if (khata2[i].name.toLowerCase() === name2.toLowerCase() && !khata2[i].paid) {
        khata2[i].paid = true;
        found = true;
      }
    }
    saveKhata(khata2);
    return found ? (name2 + " ka udhar clear kar diya.") : (name2 + " ke naam koi pending udhar nahi mila.");
  }

  var checkMatch = rawText.match(/([a-zA-Z\u0600-\u06FF]+)\s*(ka|ke)\s*(kitna)?\s*udhar/i);
  if (checkMatch && !addMatch) {
    var name3 = checkMatch[1];
    var khata3 = getKhata();
    var pending = khata3.filter(function (e) {
      return e.name.toLowerCase() === name3.toLowerCase() && !e.paid;
    });
    if (pending.length === 0) return name3 + " ke zimme koi udhar nahi hai.";
    var total = pending.reduce(function (sum, e) { return sum + e.amount; }, 0);
    return name3 + " ke zimme total " + total + " rupay udhar hai.";
  }

  if (text.indexOf("sara udhar") !== -1 || text.indexOf("poora khata") !== -1 || text.indexOf("khata dikhao") !== -1 || text.indexOf("khata sunao") !== -1) {
    var khata4 = getKhata().filter(function (e) { return !e.paid; });
    if (khata4.length === 0) return "Abhi koi udhar pending nahi hai.";
    var lines = khata4.map(function (e) { return e.name + ": " + e.amount + " rupay (" + e.due + ")"; });
    return "Pending udhar:\n" + lines.join("\n");
  }

  return null;
}

function tryLocalCommand(rawText) {
  var text = rawText.toLowerCase();

  var khataReply = tryKhataCommand(rawText);
  if (khataReply) return khataReply;

  var reminderReply = tryReminder(rawText);
  if (reminderReply) return reminderReply;

  if (text.indexOf("flashlight") !== -1 || text.indexOf("torch") !== -1) {
    var err = triggerPhoneAction("flashlight");
    return err || "Flashlight command bhej diya.";
  }

  if (text.indexOf("time") !== -1 || text.indexOf("waqt") !== -1) {
    return "Abhi time hai: " + new Date().toLocaleTimeString();
  }

  if (text.indexOf("date") !== -1 || text.indexOf("tareekh") !== -1) {
    return "Aaj ki date hai: " + new Date().toLocaleDateString();
  }

  if (text.indexOf("search ") === 0 || text.indexOf("google ") === 0) {
    var query = rawText.split(" ").slice(1).join(" ");
    window.open("https://www.google.com/search?q=" + encodeURIComponent(query), "_blank");
    return "Google pe '" + query + "' search kar diya.";
  }

  return null;
}

function getAIReply(text) {
  history.push({ role: "user", content: text });
  if (history.length > 21) {
    history = [history[0]].concat(history.slice(-20));
  }

  var aiCall = puter.ai.chat(history).then(function (response) {
    var replyText = (response && response.message && response.message.content) || String(response);
    history.push({ role: "assistant", content: replyText });
    return replyText;
  });

  var timeout = new Promise(function (resolve, reject) {
    setTimeout(function () {
      reject(new Error("AI response timeout"));
    }, 15000);
  });

  return Promise.race([aiCall, timeout]);
}

function sendMessage() {
  var text = input.value.trim();
  if (!text) return;

  addMessage(text, "user");
  input.value = "";
  sendBtn.disabled = true;
  micBtn.disabled = true;
  setStatus("Sochti hoon...", true);

  var localReply = tryLocalCommand(text);

  if (localReply) {
    addMessage(localReply, "ai");
    speak(localReply);
    setStatus("Ready to listen", false);
    sendBtn.disabled = false;
    micBtn.disabled = false;
    return;
  }

  var typingEl = addTyping();

  getAIReply(text).then(function (reply) {
    typingEl.remove();
    addMessage(reply, "ai");
    speak(reply);
  }).catch(function (err) {
    typingEl.remove();
    console.error(err);
    var msg = "Sorry, abhi connect nahi ho paya. Dobara try karo.";
    addMessage(msg, "ai");
    speak(msg);
  }).finally(function () {
    setStatus("Ready to listen", false);
    sendBtn.disabled = false;
    micBtn.disabled = false;
  });
}

sendBtn.addEventListener("click", sendMessage);
input.addEventListener("keydown", function (e) {
  if (e.key === "Enter") sendMessage();
});

function startListening() {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    alert("Voice recognition not supported in this browser.");
    return;
  }

  var recognition = new SR();
  recognition.lang = "ur-PK";
  recognition.continuous = false;
  recognition.interimResults = false;

  micBtn.classList.add("listening");
  setStatus("Sun rahi hoon...", true);

  recognition.start();

  recognition.onresult = function (event) {
    var text = event.results[0][0].transcript;
    input.value = text;
    micBtn.classList.remove("listening");
    setStatus("Mil gaya", false);
    sendMessage();
  };

  recognition.onerror = function () {
    micBtn.classList.remove("listening");
    setStatus("Sunai nahi diya, dobara try karo", false);
  };

  recognition.onend = function () {
    micBtn.classList.remove("listening");
    if (statusText.textContent.indexOf("Sun rahi") !== -1) {
      setStatus("Ready to listen", false);
    }
  };
}

micBtn.addEventListener("click", startListening);

var wakeModeOn = false;
var wakeRecognition = null;

function startWakeListener() {
  if (!wakeModeOn) return;

  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  wakeRecognition = new SR();
  wakeRecognition.lang = "ur-PK";
  wakeRecognition.continuous = false;
  wakeRecognition.interimResults = false;

  wakeRecognition.onresult = function (event) {
    var text = event.results[0][0].transcript;
    var lower = text.toLowerCase();

    if (lower.indexOf("alexa") !== -1) {
      var command = text.replace(/alexa\s*(ai)?/gi, "").trim();

      speak("Yes Boss!");
      setStatus("Yes Boss! Bolo", true);
      addMessage("Alexa", "user");
      addMessage("Yes Boss!", "ai");

      if (command) {
        input.value = command;
        sendMessage();
      } else {
        setTimeout(function () {
          if (wakeModeOn) startListening();
        }, 600);
      }
    }
  };

  wakeRecognition.onerror = function () {};

  wakeRecognition.onend = function () {
    if (wakeModeOn) {
      setTimeout(startWakeListener, 300);
    }
  };

  try {
    wakeRecognition.start();
  } catch (e) {}
}

wakeBtn.addEventListener("click", function () {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    alert("Voice recognition not supported in this browser.");
    return;
  }

  if (wakeModeOn) {
    wakeModeOn = false;
    if (wakeRecognition) wakeRecognition.stop();
    wakeBtn.classList.remove("on");
    wakeLabel.innerHTML = '"<b>Alexa</b>" bol kar jagao — abhi <b>band</b> hai';
    setStatus("Ready to listen", false);
    return;
  }

  wakeModeOn = true;
  wakeBtn.classList.add("on");
  wakeLabel.innerHTML = '"<b>Alexa</b>" bol kar jagao — abhi <b>chalu</b> hai';
  setStatus('Sun rahi hoon... "Alexa" bolo', false);

  startWakeListener();
});

</script>

</body>
</html>
